<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' http://127.0.0.1:* http://localhost:* ws://127.0.0.1:* ws://localhost:*; frame-src http: https:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'" />
    <link rel="icon" href='data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"%3E%3Crect width="64" height="64" rx="14" fill="%230a0a0a"/%3E%3Cpath d="M32 13 50 31 32 49 14 31Z" fill="%23ffffff"/%3E%3Cpath d="M32 22 41 31 32 40 23 31Z" fill="%230a0a0a"/%3E%3C/svg%3E' />
    <title>Quake Code</title>
    <script>
      // Early paint: professional dark by default (avoid white flash).
      (function () {
        try {
          if (localStorage.getItem("quake-web:theme-v2") !== "1") {
            localStorage.setItem("quake-web:theme", "dark");
            localStorage.setItem("quake-web:theme-v2", "1");
          }
          var t = localStorage.getItem("quake-web:theme") || "dark";
          if (t !== "light") t = "dark";
          document.documentElement.setAttribute("data-theme", t);
          document.documentElement.classList.toggle("dark", t === "dark");
          document.documentElement.style.colorScheme = t === "dark" ? "dark" : "light";
          document.documentElement.style.background = t === "dark" ? "#000" : "#f0f0f0";
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
          document.documentElement.classList.add("dark");
          document.documentElement.style.background = "#000";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Early paint splash (QuakeCode LoadingSplash parity) — removed when React mounts -->
      <div id="quake-boot-splash" style="position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:#0a0a0a;color:#e8e8e8;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;user-select:none">
        <img class="quake-splash-logo" src="/quake-code-q.png" width="80" height="80" alt="" aria-hidden="true" />
      </div>
      <style>
        .quake-splash-logo { display:block;width:80px;height:80px;object-fit:contain }
        html[data-theme="light"] #quake-boot-splash { background:#f0f0f0; color:#141414 }
        html[data-theme="light"] #quake-boot-splash .quake-splash-logo { filter:brightness(0);opacity:.72 }
      </style>
    </div>
    <script>
      // 3737 ham TSX verir; Vite yoksa UI eski/bozuk gorunur. 3 sn sonra uyar.
      window.setTimeout(function () {
        if (window.__QUAKE_UI_MOUNTED__) return;
        var hasVite = !!document.querySelector('script[src*="@vite/client"]');
        if (hasVite) return;
        var port = String(location.port || "");
        document.body.innerHTML =
          '<div style="font:14px/1.5 system-ui,sans-serif;max-width:520px;margin:48px auto;padding:24px;border:1px solid #444;border-radius:12px;background:#111;color:#eee">' +
          '<h1 style="margin:0 0 12px;font-size:18px">Yanlış adres — UI buradan yüklenmez</h1>' +
          '<p style="margin:0 0 8px;color:#bbb">Şu an <b>' + location.host + '</b> (port ' + (port || '?') + '). Bu API sunucusu; arayüz <b>dist</b> değil, <b>src/client</b> + Vite.</p>' +
          '<p style="margin:0 0 16px;color:#bbb"><b>dist/client</b> klasörü yok — derlenmiş eski paket değil.</p>' +
          '<p style="margin:0;color:#9cf">Çözüm: terminalde <code style="background:#222;padding:2px 6px;border-radius:4px">npm run desktop:dev</code> çalıştır veya <a href="http://127.0.0.1:5173/" style="color:#7df">http://127.0.0.1:5173</a> aç.</p></div>';
      }, 3500);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="47" viewBox="0 0 1024 47" fill="none">
  <title>Cursor-style composer input mockup</title>
  <!-- Outer canvas (terminal black) -->
  <rect width="1024" height="47" fill="#000000"/>

  <!-- Input bar -->
  <rect x="0" y="6" width="1024" height="35" fill="#0c0c0c" stroke="#2a2a2a" stroke-width="1"/>

  <!-- Prompt -->
  <text x="10" y="24" fill="#d4d4d4" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="13" font-weight="400">›</text>

  <!-- User input text -->
  <text x="24" y="24" fill="#e8e8e8" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="13" font-weight="400">olmamış birebir aynısını yapmanı istiyorum</text>

  <!-- Block cursor (inverse caret) -->
  <rect x="318" y="12" width="7" height="16" fill="#e8e8e8"/>

  <!-- Status label — same bar, bottom-right, smaller -->
  <text x="1014" y="36" text-anchor="end" fill="#6e6e6e" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="11" font-weight="400">Composer 2.5 Fast • always-approve</text>
</svg>
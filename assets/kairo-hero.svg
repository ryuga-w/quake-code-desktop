<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="600" y1="0" x2="600" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111113"/>
      <stop offset="100%" stop-color="#0a0a0b"/>
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="300" y1="200" x2="900" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    
    <linearGradient id="glowGrad" x1="600" y1="250" x2="600" y2="550" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0.1"/>
    </linearGradient>
    
    <!-- Grid pattern -->
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgGrad)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>

  <!-- Subtle glow orb -->
  <ellipse cx="600" cy="400" rx="380" ry="220" fill="url(#glowGrad)" opacity="0.6"/>

  <!-- Main abstract shape - Infinity / Neural node style -->
  <!-- Left loop -->
  <path d="M 420 320 Q 320 280 340 400 Q 360 520 420 480" 
        stroke="#67e8f9" stroke-width="3.5" stroke-opacity="0.9" fill="none"/>
  <path d="M 420 320 Q 320 280 340 400 Q 360 520 420 480" 
        stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.15" fill="none"/>
  
  <!-- Right loop -->
  <path d="M 780 320 Q 880 280 860 400 Q 840 520 780 480" 
        stroke="#14b8a6" stroke-width="3.5" stroke-opacity="0.9" fill="none"/>
  <path d="M 780 320 Q 880 280 860 400 Q 840 520 780 480" 
        stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.15" fill="none"/>

  <!-- Center connection -->
  <path d="M 420 400 Q 600 340 780 400" 
        stroke="#67e8f9" stroke-width="2" stroke-opacity="0.6" fill="none"/>
  <path d="M 420 400 Q 600 340 780 400" 
        stroke="#ffffff" stroke-width="1" stroke-opacity="0.1" fill="none"/>

  <!-- Nodes -->
  <!-- Left nodes -->
  <circle cx="340" cy="400" r="7" fill="#67e8f9"/>
  <circle cx="340" cy="400" r="3.5" fill="#0a0a0b"/>
  
  <circle cx="420" cy="320" r="6" fill="#67e8f9"/>
  <circle cx="420" cy="320" r="3" fill="#0a0a0b"/>
  
  <circle cx="420" cy="480" r="6" fill="#67e8f9"/>
  <circle cx="420" cy="480" r="3" fill="#0a0a0b"/>

  <!-- Right nodes -->
  <circle cx="860" cy="400" r="7" fill="#14b8a6"/>
  <circle cx="860" cy="400" r="3.5" fill="#0a0a0b"/>
  
  <circle cx="780" cy="320" r="6" fill="#14b8a6"/>
  <circle cx="780" cy="320" r="3" fill="#0a0a0b"/>
  
  <circle cx="780" cy="480" r="6" fill="#14b8a6"/>
  <circle cx="780" cy="480" r="3" fill="#0a0a0b"/>

  <!-- Center node -->
  <circle cx="600" cy="400" r="9" fill="#ffffff" opacity="0.15"/>
  <circle cx="600" cy="400" r="5" fill="#67e8f9"/>
  <circle cx="600" cy="400" r="2.5" fill="#0a0a0b"/>

  <!-- Floating small nodes -->
  <circle cx="280" cy="280" r="3" fill="#67e8f9" opacity="0.6"/>
  <circle cx="920" cy="280" r="3" fill="#14b8a6" opacity="0.6"/>
  <circle cx="320" cy="520" r="2.5" fill="#67e8f9" opacity="0.5"/>
  <circle cx="880" cy="520" r="2.5" fill="#14b8a6" opacity="0.5"/>
  
  <!-- Subtle connection lines -->
  <path d="M 280 280 Q 340 350 420 320" stroke="#67e8f9" stroke-width="1" stroke-opacity="0.15" fill="none"/>
  <path d="M 920 280 Q 860 350 780 320" stroke="#14b8a6" stroke-width="1" stroke-opacity="0.15" fill="none"/>

  <!-- Bottom text area hint -->
  <rect x="420" y="620" width="360" height="1" fill="#ffffff" fill-opacity="0.06"/>
  
  <!-- Small label -->
  <text x="600" y="660" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#ffffff" fill-opacity="0.35" text-anchor="middle" letter-spacing="3">KAIRO</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="640" viewBox="0 0 1024 640" fill="none">
  <title>Grok Build Beta welcome board — Quake Code layout reference</title>
  <defs>
    <style>
      .mono { font-family: "Cascadia Mono", "Consolas", "SF Mono", "Menlo", monospace; }
      .ui { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; }
    </style>
  </defs>

  <!-- Terminal canvas -->
  <rect width="1024" height="640" fill="#000000"/>

  <!-- Window title (top-left, faint) -->
  <text x="8" y="16" class="ui" fill="#5a5a5a" font-size="11">quake code</text>

  <!-- Welcome menu card -->
  <g id="welcome-card" transform="translate(302, 118)">
    <rect x="0" y="0" width="420" height="198" fill="#000000" stroke="#4a4a4a" stroke-width="1"/>

    <!-- Grok logo: circle + diagonal slash -->
    <g transform="translate(18, 18)">
      <circle cx="11" cy="11" r="10" fill="none" stroke="#6a6a6a" stroke-width="1.2"/>
      <line x1="4" y1="18" x2="18" y2="4" stroke="#9a9a9a" stroke-width="1.4" stroke-linecap="round"/>
    </g>

    <!-- Version badge -->
    <text x="44" y="30" class="mono" fill="#c8a84b" font-size="13" font-weight="500">Grok Build Beta 0.2.04</text>

    <!-- Announcement -->
    <text x="18" y="58" class="ui" fill="#d8d8d8" font-size="13" font-weight="600">Composer 2.5 is here!</text>
    <text x="18" y="78" class="ui" fill="#8a8a8a" font-size="12">Cursor's latest model is now available. Try it out in the /model picker.</text>

    <!-- Menu rows -->
    <text x="18" y="112" class="ui" fill="#b8b8b8" font-size="13">New workspace</text>
    <text x="390" y="112" class="mono" fill="#6e6e6e" font-size="12" text-anchor="end">ctrl+w</text>

    <text x="18" y="136" class="ui" fill="#b8b8b8" font-size="13">Resume session</text>
    <text x="390" y="136" class="mono" fill="#6e6e6e" font-size="12" text-anchor="end">ctrl+s</text>

    <text x="18" y="160" class="ui" fill="#b8b8b8" font-size="13">Change log</text>
    <text x="390" y="160" class="mono" fill="#6e6e6e" font-size="12" text-anchor="end">ctrl+d</text>

    <text x="18" y="184" class="ui" fill="#b8b8b8" font-size="13">Quit</text>
    <text x="390" y="184" class="mono" fill="#6e6e6e" font-size="12" text-anchor="end">ctrl+q</text>
  </g>

  <!-- Tip line (centered above composer) -->
  <text x="512" y="548" class="ui" fill="#6e6e6e" font-size="11" text-anchor="middle">Tip: Press ctrl+n to start a parallel task in its own window.</text>

  <!-- Composer input block (full width, bottom) -->
  <g id="composer" transform="translate(0, 562)">
    <!-- top border -->
    <rect x="0" y="0" width="1024" height="1" fill="#505050"/>

    <!-- input area -->
    <rect x="0" y="1" width="1024" height="28" fill="#282832"/>

    <!-- prompt -->
    <text x="10" y="20" class="mono" fill="#d4d4d4" font-size="13">›</text>
    <!-- block cursor -->
    <rect x="22" y="8" width="7" height="15" fill="#e8e8e8"/>

    <!-- metadata row -->
    <rect x="0" y="29" width="1024" height="22" fill="#282832"/>
    <text x="1014" y="44" class="ui" fill="#6e6e6e" font-size="11" text-anchor="end">grok-4 • always approve</text>

    <!-- bottom border -->
    <rect x="0" y="51" width="1024" height="1" fill="#505050"/>
  </g>

  <!-- Optional beta pill (far right of composer, faint) -->
  <rect x="968" y="571" width="34" height="14" rx="2" fill="none" stroke="#4a4a4a" stroke-width="1"/>
  <text x="985" y="581" class="ui" fill="#6e6e6e" font-size="9" text-anchor="middle">beta</text>
</svg>
name: Feature request
description: Propose an improvement grounded in a user problem
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Strong proposals explain the workflow problem before prescribing the interface or implementation.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who encounters this problem, and what are they trying to accomplish?
      placeholder: When I…, I cannot…
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should become possible? Include a concrete example when useful.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Optional UI, behavior, or implementation ideas.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe current workarounds or other approaches.

  - type: textarea
    id: safety
    attributes:
      label: Permission and security impact
      description: Could this affect files, commands, credentials, browser/desktop control, networking, or user approval?

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and the roadmap for similar requests.
          required: true
        - label: This request describes one focused outcome.
          required: true

<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mafya Şehri — Gizli Teslimat</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#000;font-family:'Georgia','Times New Roman',serif;cursor:default;user-select:none}
canvas{display:block}

#menu{
  position:fixed;inset:0;z-index:100;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at center,#1a1a2e 0%,#0a0a0f 70%,#000 100%);
  transition:opacity 0.8s;opacity:1;
}
#menu.hidden{opacity:0;pointer-events:none}
#menu h1{
  font-size:3rem;color:#d4a84b;text-shadow:0 0 40px rgba(212,168,75,0.3),0 4px 8px rgba(0,0,0,0.8);
  letter-spacing:6px;text-transform:uppercase;margin-bottom:8px;
}
#menu .subtitle{font-size:1rem;color:#8a7a5a;letter-spacing:3px;margin-bottom:30px;text-transform:uppercase}
#menu .controls-info{font-size:0.8rem;color:#555;line-height:1.8;text-align:center;margin-bottom:30px;font-family:'Arial',sans-serif}
#menu .controls-info span{color:#8a7a5a}
#startBtn{
  padding:14px 60px;font-size:1.2rem;font-family:inherit;
  background:linear-gradient(135deg,#d4a84b,#b8922e);color:#1a1a1a;border:none;
  border-radius:4px;cursor:pointer;text-transform:uppercase;letter-spacing:4px;
  transition:all 0.3s;box-shadow:0 0 30px rgba(212,168,75,0.2);
}
#startBtn:hover{transform:scale(1.05);box-shadow:0 0 50px rgba(212,168,75,0.4)}

#speedometer{
  position:fixed;bottom:30px;right:30px;z-index:10;display:none;
  width:120px;height:120px;border-radius:50%;
  background:rgba(0,0,0,0.75);border:2px solid #d4a84b;
  flex-direction:column;align-items:center;justify-content:center;
}
#speedometer .speed-value{font-size:2rem;color:#fff;font-weight:bold;font-family:'Arial',sans-serif}
#speedometer .speed-unit{font-size:0.7rem;color:#d4a84b;letter-spacing:2px;text-transform:uppercase}

#navIndicator{
  position:fixed;bottom:30px;left:30px;z-index:10;display:none;
  background:rgba(0,0,0,0.75);border:1px solid #d4a84b;border-radius:4px;
  padding:10px 16px;color:#fff;font-size:0.85rem;font-family:'Arial',sans-serif
}
#navIndicator .label{color:#d4a84b;font-size:0.7rem;text-transform:uppercase;letter-spacing:1px}

#prompt{
  position:fixed;bottom:80px;left:50%;z-index:10;display:none;
  transform:translateX(-50%);
  background:rgba(0,0,0,0.85);border:1px solid #d4a84b;border-radius:4px;
  padding:12px 28px;color:#fff;font-size:1rem;letter-spacing:1px;
  text-align:center;pointer-events:none
}
#prompt .key{color:#d4a84b;font-weight:bold}

#dialogue{
  position:fixed;bottom:120px;left:50%;z-index:20;display:none;
  transform:translateX(-50%);width:60%;max-width:600px;
  background:rgba(0,0,0,0.9);border:1px solid #d4a84b;border-radius:6px;
  padding:24px 32px;color:#e8d5b0;font-size:1.05rem;line-height:1.7;text-align:center
}
#dialogue .speaker{color:#d4a84b;font-weight:bold;margin-bottom:8px;font-size:0.9rem;letter-spacing:2px;text-transform:uppercase}

#complete{
  position:fixed;inset:0;z-index:50;display:none;
  flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at center,#1a1a2e 0%,#000 100%)
}
#complete.active{display:flex}
#complete h1{
  font-size:2.8rem;color:#d4a84b;text-shadow:0 0 60px rgba(212,168,75,0.3);
  letter-spacing:8px;text-transform:uppercase;margin-bottom:16px
}
#complete .sub{font-size:1rem;color:#8a7a5a;margin-bottom:8px}
#complete .time{font-size:1.2rem;color:#e8d5b0;margin-bottom:40px}
#replayBtn{
  padding:14px 50px;font-size:1.1rem;font-family:inherit;
  background:linear-gradient(135deg,#d4a84b,#b8922e);color:#1a1a1a;border:none;
  border-radius:4px;cursor:pointer;text-transform:uppercase;letter-spacing:3px;
  transition:all 0.3s
}
#replayBtn:hover{transform:scale(1.05)}

.letterbox{position:fixed;left:0;right:0;z-index:5;pointer-events:none;background:#000;transition:opacity 0.5s}
.letterbox.top{top:0;height:60px}
.letterbox.bottom{bottom:0;height:60px}

#fadeOverlay{
  position:fixed;inset:0;z-index:30;background:#000;opacity:0;
  pointer-events:none;transition:opacity 0.5s
}
#fadeOverlay.active{opacity:1}
</style>
</head>
<body>

<div id="menu">
  <h1>MAFYA ŞEHRi</h1>
  <div class="subtitle">— Gizli Teslimat —</div>
  <div class="controls-info">
    <span>YÜRÜME:</span> WASD &nbsp;|&nbsp; <span>KAMERA:</span> Fare<br>
    <span>SÜRÜŞ:</span> W/Gaz &nbsp; A/D/Yön &nbsp; S/Fren &nbsp; ␣/El Freni<br>
    <span>ETKİLEŞİM:</span> E
  </div>
  <button id="startBtn">Göreve Başla</button>
</div>

<div id="speedometer">
  <div class="speed-value" id="speedVal">0</div>
  <div class="speed-unit">km/h</div>
</div>

<div id="navIndicator">
  <div class="label">HEDEF</div>
  <div style="display:flex;gap:12px;margin-top:4px"><span id="navDir">▲</span><span id="navDist">0</span></div>
</div>

<div id="prompt"></div>

<div id="dialogue"><div class="speaker"></div><div class="text"></div></div>

<div id="complete">
  <h1>GÖREV TAMAMLANDI</h1>
  <div class="sub">Teslimat başarıyla gerçekleştirildi</div>
  <div class="time" id="completeTime">—</div>
  <button id="replayBtn">Tekrar Oyna</button>
</div>

<div class="letterbox top" id="lbTop"></div>
<div class="letterbox bottom" id="lbBottom"></div>
<div id="fadeOverlay"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ====================================================================
// MAFYA ŞEHRİ — GİZLİ TESLİMAT
// Tek dosya 3D oyun — Three.js r128
// ====================================================================

(function() {
'use strict';

const ROAD_LENGTH = 220;
const ROAD_WIDTH = 16;
const SIDEWALK = 4;
const CLUB_Z = -(ROAD_LENGTH + 6);
const INTERIOR_Z = CLUB_Z - 6;

// ==================== SETUP ====================
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.9;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a1a);
scene.fog = new THREE.FogExp2(0x0a0a1a, 0.007);

const cam = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 200);
cam.position.set(6, 4, 8);

const clock = new THREE.Clock();

// ==================== LIGHTS ====================
scene.add(new THREE.AmbientLight(0x223355, 0.25));
const moon = new THREE.DirectionalLight(0x446688, 0.35);
moon.position.set(20, 30, -10);
moon.castShadow = true;
moon.shadow.mapSize.set(1024, 1024);
moon.shadow.camera.near = 1;
moon.shadow.camera.far = 80;
moon.shadow.camera.left = -40;
moon.shadow.camera.right = 40;
moon.shadow.camera.top = 40;
moon.shadow.camera.bottom = -40;
scene.add(moon);

// ==================== GROUND / ROAD ====================
const groundMat = new THREE.MeshStandardMaterial({ color: 0x141424, roughness: 0.55, metalness: 0.15 });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, ROAD_LENGTH + 60), groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.set(0, -0.01, -(ROAD_LENGTH / 2 - 20));
ground.receiveShadow = true;
scene.add(ground);

const roadMat = new THREE.MeshStandardMaterial({ color: 0x1e1e2e, roughness: 0.6, metalness: 0.25 });
const road = new THREE.Mesh(new THREE.PlaneGeometry(ROAD_WIDTH, ROAD_LENGTH + 40), roadMat);
road.rotation.x = -Math.PI / 2;
road.position.set(0, 0.0, -(ROAD_LENGTH / 2 - 10));
road.receiveShadow = true;
scene.add(road);

// Lane dashes
const dashMat = new THREE.MeshStandardMaterial({ color: 0x8899aa, emissive: 0x334455, emissiveIntensity: 0.2 });
for (let z = 10; z >= -ROAD_LENGTH - 10; z -= 3.5) {
  if (Math.abs(z % 7) < 0.5) continue;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(0.25, 1.2), dashMat);
  m.rotation.x = -Math.PI / 2;
  m.position.set(0, 0.005, z);
  scene.add(m);
}

// Sidewalks
const swMat = new THREE.MeshStandardMaterial({ color: 0x2a2a3a, roughness: 0.85 });
for (let s = -1; s <= 1; s += 2) {
  const sw = new THREE.Mesh(new THREE.PlaneGeometry(SIDEWALK, ROAD_LENGTH + 40), swMat);
  sw.rotation.x = -Math.PI / 2;
  sw.position.set(s * (ROAD_WIDTH / 2 + SIDEWALK / 2), 0.005, -(ROAD_LENGTH / 2 - 10));
  sw.receiveShadow = true;
  scene.add(sw);
}

// Road edge markers
const edgeMat = new THREE.MeshStandardMaterial({ color: 0x445566, emissive: 0x112233, emissiveIntensity: 0.1 });
for (let s = -1; s <= 1; s += 2) {
  for (let z = 10; z >= -ROAD_LENGTH - 5; z -= 2) {
    const e = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.08, 1.2), edgeMat);
    e.position.set(s * (ROAD_WIDTH / 2 - 0.1), 0.04, z);
    scene.add(e);
  }
}

// ==================== BUILDINGS ====================
const buildingList = [];
function addBuilding(x, z, w, h, d, col) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    new THREE.MeshStandardMaterial({ color: col || 0x334466, roughness: 0.75, metalness: 0.05 })
  );
  body.position.y = h / 2;
  body.castShadow = true;
  g.add(body);

  const wLit = new THREE.MeshStandardMaterial({ color: 0xffdd88, emissive: 0xffaa44, emissiveIntensity: 0.4 + Math.random() * 0.6 });
  const wDark = new THREE.MeshStandardMaterial({ color: 0x111122 });
  for (let r = 0; r < Math.floor(h / 2.8); r++) {
    for (let c = 0; c < Math.floor(w / 1.8); c++) {
      const wm = Math.random() > 0.35 ? wLit : wDark;
      const win = new THREE.Mesh(new THREE.PlaneGeometry(0.6, 1.0), wm);
      win.position.set(-w / 2 + 0.9 + c * 1.8, 1.4 + r * 2.8, d / 2 + 0.01);
      g.add(win);
    }
  }
  g.position.set(x, 0, z);
  scene.add(g);
  buildingList.push({ x, z, w, h, d });
}

for (let z = 16; z >= -ROAD_LENGTH - 8; z -= 10 + Math.random() * 4) {
  for (let s = -1; s <= 1; s += 2) {
    const w = 4 + Math.random() * 7;
    const h = 7 + Math.random() * 20;
    const d = 5 + Math.random() * 6;
    const x = s * (ROAD_WIDTH / 2 + SIDEWALK / 2 + 1.5 + d / 2);
    const col = new THREE.Color().setHSL(0.6 + Math.random() * 0.08, 0.12, 0.12 + Math.random() * 0.1);
    addBuilding(x, z, w, h, d, col);
  }
}

// ==================== STREET LAMPS ====================
function makeLamp(x, z) {
  const g = new THREE.Group();
  const poleMat = new THREE.MeshStandardMaterial({ color: 0x333344, metalness: 0.4, roughness: 0.4 });
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.10, 3.5), poleMat);
  pole.position.y = 1.75;
  g.add(pole);
  const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.6), poleMat);
  arm.position.set(0.3, 3.2, 0);
  arm.rotation.z = Math.PI / 3;
  g.add(arm);
  const bulb = new THREE.Mesh(
    new THREE.SphereGeometry(0.12, 6, 6),
    new THREE.MeshStandardMaterial({ color: 0xffdd99, emissive: 0xffcc77, emissiveIntensity: 1.2 })
  );
  bulb.position.set(0.5, 3.3, 0);
  g.add(bulb);
  const pl = new THREE.PointLight(0xffcc88, 1.2, 10);
  pl.position.set(0.5, 3.2, 0);
  g.add(pl);
  g.position.set(x, 0, z);
  return g;
}
for (let z = 10; z >= -ROAD_LENGTH - 5; z -= 13) {
  for (let s = -1; s <= 1; s += 2)
    scene.add(makeLamp(s * (ROAD_WIDTH / 2 + SIDEWALK - 0.5), z));
}

// ==================== RAIN ====================
const RAIN_COUNT = 2500;
const rainPos = new Float32Array(RAIN_COUNT * 3);
const rainVel = new Float32Array(RAIN_COUNT);
for (let i = 0; i < RAIN_COUNT; i++) {
  rainPos[i * 3] = (Math.random() - 0.5) * 140;
  rainPos[i * 3 + 1] = Math.random() * 30;
  rainPos[i * 3 + 2] = -(Math.random() * (ROAD_LENGTH + 20));
  rainVel[i] = 14 + Math.random() * 8;
}
const rainGeo = new THREE.BufferGeometry();
rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
const rainPts = new THREE.Points(
  rainGeo,
  new THREE.PointsMaterial({ color: 0x88aadd, size: 0.06, transparent: true, opacity: 0.4 })
);
scene.add(rainPts);

// ==================== AUDIO ====================
const audioCtx = { ctx: null, engineOsc: null, engineGain: null, ready: false };
function initAudio() {
  try {
    audioCtx.ctx = new (window.AudioContext || window.webkitAudioContext)();
    audioCtx.ready = true;
    // Rain noise
    const sr = audioCtx.ctx.sampleRate;
    const buf = audioCtx.ctx.createBuffer(1, sr * 4, sr);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * 0.5;
    const src = audioCtx.ctx.createBufferSource();
    src.buffer = buf;
    src.loop = true;
    const gn = audioCtx.ctx.createGain();
    gn.gain.value = 0.06;
    src.connect(gn);
    gn.connect(audioCtx.ctx.destination);
    src.start();
  } catch (e) { audioCtx.ready = false; }
}
function startEngine() {
  if (!audioCtx.ready || !audioCtx.ctx) return;
  if (audioCtx.engineOsc) return;
  audioCtx.engineOsc = audioCtx.ctx.createOscillator();
  audioCtx.engineOsc.type = 'sawtooth';
  audioCtx.engineGain = audioCtx.ctx.createGain();
  audioCtx.engineGain.gain.value = 0;
  const lp = audioCtx.ctx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = 180;
  audioCtx.engineOsc.connect(lp);
  lp.connect(audioCtx.engineGain);
  audioCtx.engineGain.connect(audioCtx.ctx.destination);
  audioCtx.engineOsc.start();
}
function updateEngine(speed) {
  if (!audioCtx.ready || !audioCtx.engineOsc) return;
  const now = audioCtx.ctx.currentTime;
  const freq = 50 + Math.abs(speed) * 4;
  audioCtx.engineOsc.frequency.setTargetAtTime(Math.min(freq, 400), now, 0.05);
  const vol = Math.min(0.18, Math.abs(speed) * 0.005 + 0.01);
  audioCtx.engineGain.gain.setTargetAtTime(vol, now, 0.05);
}
function stopEngine() {
  if (audioCtx.engineOsc) {
    try { audioCtx.engineOsc.stop(); } catch (e) {}
    audioCtx.engineOsc = null;
    audioCtx.engineGain = null;
  }
}
function squealTire() {
  if (!audioCtx.ready || !audioCtx.ctx) return;
  const osc = audioCtx.ctx.createOscillator();
  osc.type = 'square';
  osc.frequency.value = 900;
  const g = audioCtx.ctx.createGain();
  g.gain.value = 0.05;
  const lp = audioCtx.ctx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = 1100;
  osc.connect(lp);
  lp.connect(g);
  g.connect(audioCtx.ctx.destination);
  osc.start();
  osc.stop(audioCtx.ctx.currentTime + 0.25);
}
function doorSound() {
  if (!audioCtx.ready || !audioCtx.ctx) return;
  const osc = audioCtx.ctx.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(180, audioCtx.ctx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(60, audioCtx.ctx.currentTime + 0.2);
  const g = audioCtx.ctx.createGain();
  g.gain.setValueAtTime(0.1, audioCtx.ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.ctx.currentTime + 0.25);
  osc.connect(g);
  g.connect(audioCtx.ctx.destination);
  osc.start();
  osc.stop(audioCtx.ctx.currentTime + 0.25);
}

// ==================== CHARACTER ====================
function makeChar(suitColor) {
  const g = new THREE.Group();
  const col = suitColor || 0x0e0e1e;
  const bMat = new THREE.MeshStandardMaterial({ color: col, roughness: 0.7, metalness: 0.05 });
  const sMat = new THREE.MeshStandardMaterial({ color: 0xccbb99, roughness: 0.6 });

  const body = new THREE.Mesh(new THREE.BoxGeometry(0.65, 0.8, 0.38), bMat);
  body.position.y = 0.85;
  body.castShadow = true;
  g.add(body);

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.18, 8, 8), sMat);
  head.position.y = 1.5;
  g.add(head);

  // Hat
  const hMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0a, roughness: 0.8 });
  const hat = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.32, 0.05, 10), hMat);
  hat.position.y = 1.6;
  g.add(hat);
  const hat2 = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.17, 0.12, 10), hMat);
  hat2.position.y = 1.68;
  g.add(hat2);

  // Arms
  const lArm = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.07, 0.4), bMat);
  lArm.position.set(-0.4, 1.05, 0);
  lArm.rotation.z = 0.15;
  g.add(lArm);
  const lFore = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.06, 0.3), bMat);
  lFore.position.set(-0.47, 0.72, 0);
  lFore.rotation.z = 0.05;
  g.add(lFore);

  const rArm = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.07, 0.4), bMat);
  rArm.position.set(0.4, 1.05, 0);
  rArm.rotation.z = -0.15;
  g.add(rArm);
  const rFore = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.06, 0.3), bMat);
  rFore.position.set(0.47, 0.72, 0);
  rFore.rotation.z = -0.05;
  g.add(rFore);

  // Legs
  const legMat = new THREE.MeshStandardMaterial({ color: 0x0c0c1c, roughness: 0.7 });
  const lLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.09, 0.45), legMat);
  lLeg.position.set(-0.15, 0.22, 0);
  g.add(lLeg);
  const lShin = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.08, 0.4), legMat);
  lShin.position.set(-0.15, -0.15, 0);
  g.add(lShin);
  const rLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.09, 0.45), legMat);
  rLeg.position.set(0.15, 0.22, 0);
  g.add(rLeg);
  const rShin = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.08, 0.4), legMat);
  rShin.position.set(0.15, -0.15, 0);
  g.add(rShin);

  g.userData = { lArm, rArm, lFore, rFore, lLeg, rLeg, lShin, rShin, body };
  return g;
}

function makeBriefcase() {
  const g = new THREE.Group();
  g.add(new THREE.Mesh(
    new THREE.BoxGeometry(0.28, 0.10, 0.18),
    new THREE.MeshStandardMaterial({ color: 0x3d2211, roughness: 0.5, metalness: 0.15 })
  ));
  return g;
}

// ==================== VEHICLE ====================
function makeVehicle() {
  const g = new THREE.Group();
  const bMat = new THREE.MeshStandardMaterial({
    color: 0x0a0a0a, roughness: 0.2, metalness: 0.4
  });
  const cMat = new THREE.MeshStandardMaterial({
    color: 0xccddee, roughness: 0.1, metalness: 0.8
  });
  const glMat = new THREE.MeshStandardMaterial({
    color: 0x223344, roughness: 0.15, metalness: 0.05, transparent: true, opacity: 0.35
  });

  const body = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.45, 4.2), bMat);
  body.position.y = 0.4;
  body.castShadow = true;
  g.add(body);

  const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.35, 1.8), glMat);
  cabin.position.set(0, 0.78, -0.25);
  g.add(cabin);

  // Hood
  const hood = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.08, 0.9), bMat);
  hood.position.set(0, 0.56, 1.55);
  g.add(hood);

  // Trunk
  const trunk = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.15, 0.7), bMat);
  trunk.position.set(0, 0.52, -1.55);
  g.add(trunk);

  // Chrome
  const grille = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.12, 0.04), cMat);
  grille.position.set(0, 0.42, 2.1);
  g.add(grille);
  const trim = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.02, 4.0), cMat);
  trim.position.set(0, 0.6, 0);
  g.add(trim);

  // Headlights
  const hlMat = new THREE.MeshStandardMaterial({ color: 0xffffee, emissive: 0xffffcc, emissiveIntensity: 2.5 });
  for (let s = -1; s <= 1; s += 2) {
    const hl = new THREE.Mesh(new THREE.SphereGeometry(0.10, 8, 8), hlMat);
    hl.position.set(s * 0.55, 0.42, 2.12);
    g.add(hl);
  }

  // Tail lights
  const tlMat = new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0xff0000, emissiveIntensity: 1.2 });
  for (let s = -1; s <= 1; s += 2) {
    const tl = new THREE.Mesh(new THREE.SphereGeometry(0.07, 6, 6), tlMat);
    tl.position.set(s * 0.55, 0.38, -2.12);
    g.add(tl);
  }

  // Wheels
  const whMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });

      rim.rotation.x = Math.PI / 2;
      wg.add(rim);
      wg.position.set(s * 0.92, 0.28, a * 1.45);
      g.add(wg);
      wheels.push({ group: wg, tire, side: s, axle: a });

  g.userData.wheels = wheels;

  // Headlight spots
  for (let s = -1; s <= 1; s += 2) {

  return g;
}

// ==================== VEHICLE PHYSICS ====================
function makePhysics() {
  return {
    pos: new THREE.Vector3(7, 0.28, 18),
    yaw: Math.PI,
    speed: 0,
    latVel: 0,
    roll: 0,
    pitch: 0,
    steerAngle: 0,
    prevSpeed: 0,
    prevLat: 0,
    collisionShake: 0,
    drifting: false,
    update: function (dt, inp) {
      if (dt > 0.05) dt = 0.05;
      const engForce = inp.gas * 18000;
      const brkForce = inp.brake * 25000;

      const targetSteer = inp.steer * 0.55;
      this.steerAngle += (targetSteer - this.steerAngle) * Math.min(1, 2.5 * dt);

      const fwd = new THREE.Vector3(-Math.sin(this.yaw), 0, -Math.cos(this.yaw));
      const right = new THREE.Vector3(Math.cos(this.yaw), 0, -Math.sin(this.yaw));

      let totalF = engForce;
      if (inp.brake > 0) totalF -= brkForce * Math.sign(this.speed || 0.01);
      totalF -= 0.35 * this.speed * Math.abs(this.speed) * 0.5;
      totalF -= 0.02 * 1500 * 9.81 * Math.sign(this.speed || 0.01);

      this.speed += (totalF / 1500) * dt;
      this.speed = Math.max(-8, Math.min(45, this.speed));

      const absS = Math.abs(this.speed);
      if (absS > 0.5) {
        const steerF = this.steerAngle * this.speed * this.speed * 0.07;
        const grip = inp.handbrake ? 0.75 * 0.2 : 0.75;
        const gripF = -this.latVel * grip * 8;
        this.latVel += (steerF + gripF) * dt;
        if (inp.handbrake && absS > 2) {
          this.drifting = true;
          this.latVel += (steerF + gripF) * dt * 0.8;
        } else {
          this.drifting = false;
        }
        this.latVel *= Math.max(0, 1 - 1.5 * dt);
      } else {
        this.drifting = false;
        this.latVel *= Math.max(0, 1 - 4 * dt);
      }

      const maxLat = Math.max(0.3, absS * 0.25);
      this.latVel = Math.max(-maxLat, Math.min(maxLat, this.latVel));

      this.pos.x += (fwd.x * this.speed + right.x * this.latVel) * dt;
      this.pos.z += (fwd.z * this.speed + right.z * this.latVel) * dt;

      const yawR = (this.steerAngle * this.speed / 2.5) * (1 + Math.abs(this.latVel) * 0.3);
      this.yaw += yawR * dt;

      const lAcc = (this.speed - this.prevSpeed) / Math.max(0.01, dt);
      const laAcc = (this.latVel - this.prevLat) / Math.max(0.01, dt);

      const rT = Math.max(-0.4, Math.min(0.4, -laAcc * 0.015));
      const pT = Math.max(-0.15, Math.min(0.15, -lAcc * 0.008));
      this.roll += (rT - this.roll) * Math.min(1, 4 * dt);
      this.pitch += (pT - this.pitch) * Math.min(1, 4 * dt);

      this.prevSpeed = this.speed;
      this.prevLat = this.latVel;

      if (this.collisionShake > 0) this.collisionShake *= Math.max(0, 1 - 3 * dt);
      if (this.collisionShake < 0.001) this.collisionShake = 0;
    },
    collide: function () {
      this.speed *= 0.3;
      this.collisionShake = 1.0;
    }
  };
}

// ==================== CAMERA STATE ====================
const camS = {
  mode: 'menu',
  walkAngle: 0.3,
  walkDist: 4.5,
  walkHeight: 2.8,
  shake: 0,
  mouseX: 0,
  mouseY: 0
};

function updateCamera(dt, charPos, carObj, carPhys) {
  let shake = camS.shake;
  if (carPhys && carPhys.collisionShake > shake) shake = carPhys.collisionShake;
  const sOff = new THREE.Vector3();
  if (shake > 0.01) {
    sOff.set((Math.random() - 0.5) * shake * 0.4, (Math.random() - 0.5) * shake * 0.4, (Math.random() - 0.5) * shake * 0.3);
    camS.shake *= Math.max(0, 1 - 3 * dt);
    if (carPhys) carPhys.collisionShake *= Math.max(0, 1 - 3 * dt);
  }

  let targetPos = new THREE.Vector3();
  let targetLook = new THREE.Vector3();

  if (camS.mode === 'walk' || camS.mode === 'walkToDoor') {
    const behind = new THREE.Vector3(
      -Math.sin(camS.walkAngle) * camS.walkDist,
      camS.walkHeight,
      -Math.cos(camS.walkAngle) * camS.walkDist
    );
    targetPos.copy(charPos).add(behind);
    targetLook.copy(charPos);
    targetLook.y += 0.8;
    cam.position.lerp(targetPos.clone().add(sOff), Math.min(1, 8 * dt));
    cam.lookAt(targetLook);
  } else if (camS.mode === 'drive' && carObj && carPhys) {
    const cDist = 5 + Math.abs(carPhys.speed) * 0.05;
    const cH = 2.2 + Math.abs(carPhys.speed) * 0.02;
    const bDir = new THREE.Vector3(Math.sin(carPhys.yaw), 0, Math.cos(carPhys.yaw));
    targetPos.set(
      carPhys.pos.x + bDir.x * cDist,
      carPhys.pos.y + cH + Math.abs(carPhys.roll) * 0.4,
      carPhys.pos.z + bDir.z * cDist
    );
    const lA = 4 + Math.abs(carPhys.speed) * 0.1;
    targetLook.set(
      carPhys.pos.x - Math.sin(carPhys.yaw) * lA,
      carPhys.pos.y + 0.3,
      carPhys.pos.z - Math.cos(carPhys.yaw) * lA
    );
    cam.position.lerp(targetPos.clone().add(sOff), Math.min(1, 4 * dt));
    cam.lookAt(targetLook);
  } else if (camS.mode === 'interior') {
    targetPos.set(0, 1.7, INTERIOR_Z + 4.2);
    targetLook.set(0, 1.0, INTERIOR_Z - 0.5);
    cam.position.lerp(targetPos.clone().add(sOff), Math.min(1, 3 * dt));
    cam.lookAt(targetLook);
  }

  // Letterbox
  const lbT = document.getElementById('lbTop');
  const lbB = document.getElementById('lbBottom');
  const show = (camS.mode === 'drive' || camS.mode === 'interior');
  lbT.style.opacity = show ? '1' : '0';
  lbB.style.opacity = show ? '1' : '0';
}

// ==================== ANIMATE CHARACTER ====================
function animChar(char, dt, speed, moving) {
  if (!char || !char.userData) return;
  const ud = char.userData;
  const t = clock.elapsedTime;
  const wp = speed * 4.5;

  if (moving && Math.abs(speed) > 0.05) {
    ud.lLeg.rotation.x = Math.sin(t * wp) * 0.5;
    ud.rLeg.rotation.x = Math.sin(t * wp + Math.PI) * 0.5;
    ud.lShin.rotation.x = Math.sin(t * wp + 0.3) * 0.2;
    ud.rShin.rotation.x = Math.sin(t * wp + Math.PI + 0.3) * 0.2;
    ud.lArm.rotation.z = 0.15 + Math.sin(t * wp + Math.PI) * 0.2;
    ud.rArm.rotation.z = -0.15 + Math.sin(t * wp) * 0.2;
    ud.lFore.rotation.z = 0.05 + Math.sin(t * wp + Math.PI) * 0.1;
    ud.rFore.rotation.z = -0.05 + Math.sin(t * wp) * 0.1;
    ud.body.position.y = 0.85 + Math.sin(t * wp * 2) * 0.025;
  } else {
    ud.lLeg.rotation.x *= 0.9;
    ud.rLeg.rotation.x *= 0.9;
    ud.lShin.rotation.x *= 0.9;
    ud.rShin.rotation.x *= 0.9;
    ud.lArm.rotation.z = 0.15 + Math.sin(t * 0.6) * 0.02;
    ud.rArm.rotation.z = -0.15 - Math.sin(t * 0.6) * 0.02;
    ud.body.position.y += (0.85 - ud.body.position.y) * 0.08;
  }

  // Briefcase sway
  if (briefcaseObj) {
    if (moving && Math.abs(speed) > 0.05) {
      briefcaseObj.rotation.z = Math.sin(t * wp * 1.5) * 0.06;
    } else {
      briefcaseObj.rotation.z *= 0.9;
    }
  }
}

function animWheels(car, phys, dt) {
  if (!car || !car.userData || !car.userData.wheels) return;
  const rot = phys.speed / 0.28 * dt;
  for (const w of car.userData.wheels) {
    w.tire.rotation.z += rot;
    if (w.axle === 1) {
      w.group.rotation.y = (phys.steerAngle / 0.55) * 0.4;
    }
  }
}

// ==================== MAIN LOOP ====================
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // Rain
  const rp = rainPts.geometry.attributes.position.array;
  for (let i = 0; i < RAIN_COUNT; i++) {
    rp[i * 3 + 1] -= rainVel[i] * dt;
    rp[i * 3] += Math.sin(t + i) * 0.02;
    if (rp[i * 3 + 1] < -1) {
      rp[i * 3 + 1] = 25 + Math.random() * 5;
      rp[i * 3] = (Math.random() - 0.5) * 140;
      rp[i * 3 + 2] = -(Math.random() * (ROAD_LENGTH + 10));
    }
  }
  rainPts.geometry.attributes.position.needsUpdate = true;

  // Neon flicker
  scene.children.forEach(function(c) {
    if (c.userData && c.userData.neon) {
      c.userData.neon.forEach(function(n) {
        if (n.material) n.material.emissiveIntensity = 0.8 + Math.sin(t * 3.7 + n.id) * 0.25 + Math.sin(t * 7.3) * 0.12;
      });
    }
  });

  // Interior candle flicker
  if (interiorObj && interiorObj.visible && interiorObj.userData) {
    if (interiorObj.userData.candle) {
      interiorObj.userData.candle.material.emissiveIntensity = 1.5 + Math.sin(t * 5.1) * 0.5 + Math.sin(t * 11.3) * 0.3;
    }
    if (interiorObj.userData.warmLight) {
      interiorObj.userData.warmLight.intensity = 1.8 + Math.sin(t * 4.3) * 0.3;
    }
  }

  // Input
  const inp = {
    forward: keys['w'] ? 1 : 0,
    backward: keys['s'] ? 1 : 0,
    left: keys['a'] ? 1 : 0,
    right: keys['d'] ? 1 : 0,
    gas: 0, brake: 0, steer: 0,
    handbrake: !!keys['space'],
    interact: !!keys['e']
  };
  keys['e'] = false;

  // --- STATE MACHINE ---
  switch (gameState) {

    case 'menu':
      // handled by HTML button
      break;

    case 'walk': {
      let dx = 0, dz = 0;
      if (inp.forward) dz -= 1;
      if (inp.backward) dz += 1;
      if (inp.left) dx -= 1;
      if (inp.right) dx += 1;
      const moving = dx !== 0 || dz !== 0;

      if (moving) {
        const len = Math.sqrt(dx * dx + dz * dz);
        dx /= len;
        dz /= len;

        const targetAngle = Math.atan2(dx, dz);
        let diff = targetAngle - charObj.rotation.y;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        charObj.rotation.y += diff * Math.min(1, 10 * dt);

        const ca = camS.walkAngle;
        charObj.position.x += (dx * Math.cos(ca) - dz * Math.sin(ca)) * 3.5 * dt;
        charObj.position.z += (dx * Math.sin(ca) + dz * Math.cos(ca)) * 3.5 * dt;

        // Mouse look while walking
        camS.walkAngle += mouseX * 0.003;
        mouseX = 0;
      }
      charPos.copy(charObj.position);
      animChar(charObj, dt, moving ? 1 : 0, moving);

      // Check near car
      const dCar = charPos.distanceTo(carPhys.pos);
      if (dCar < 3) {
        showPrompt('<span class="key">E</span> — Bin');
        if (inp.interact) {
          hidePrompt();
          gameState = 'enterCar';
          entryPhase = 0;
          doorSound();
          fadeEl.classList.add('active');
          setTimeout(function() {
            charObj.visible = false;
            setTimeout(function() {
              fadeEl.classList.remove('active');
              camS.mode = 'drive';
              gameState = 'drive';
              startEngine();
              speedo.style.display = 'flex';
              navInd.style.display = 'block';
            }, 500);
          }, 500);
        }
      } else hidePrompt();
      break;
    }

    case 'enterCar': {
      entryPhase += dt;
      // Wait for fade transition
      break;
    }

    case 'drive': {
      inp.gas = inp.forward;
      inp.brake = inp.backward;
      inp.steer = inp.right - inp.left;

      carPhys.update(dt, inp);
      carObj.position.copy(carPhys.pos);
      carObj.position.y = 0.28 + Math.abs(carPhys.roll) * 0.04 + Math.abs(carPhys.pitch) * 0.02;
      carObj.rotation.y = carPhys.yaw;
      carObj.rotation.z = carPhys.roll * 0.08;
      carObj.rotation.x = carPhys.pitch * 0.06;
      animWheels(carObj, carPhys, dt);

      // Drift effects
      if (carPhys.drifting && Math.abs(carPhys.speed) > 4) {
        squealTire();
      }

      // Speedometer
      const kmh = Math.abs(carPhys.speed) * 3.6;
      speedVal.textContent = Math.round(kmh);
      updateEngine(carPhys.speed);

      // Nav
      const tgt = new THREE.Vector3(3.5, 0, CLUB_Z + 2);
      const dist = carPhys.pos.distanceTo(tgt);
      navDist.textContent = Math.round(dist) + 'm';
      const aT = Math.atan2(tgt.x - carPhys.pos.x, tgt.z - carPhys.pos.z);
      let rel = aT - carPhys.yaw;
      while (rel > Math.PI) rel -= Math.PI * 2;
      while (rel < -Math.PI) rel += Math.PI * 2;
      navDir.textContent = rel > 0.3 ? '◄' : rel < -0.3 ? '►' : '▲';

      // Collisions
      for (const b of buildingList) {
        const dx2 = carPhys.pos.x - b.x;
        const dz2 = carPhys.pos.z - b.z;
        if (Math.abs(dx2) < b.w / 2 + 1 && Math.abs(dz2) < b.d / 2 + 1) {
          carPhys.collide();
          camS.shake = 0.5;
          carPhys.pos.x += dx2 > 0 ? 0.3 : -0.3;
          carPhys.pos.z += dz2 > 0 ? 0.3 : -0.3;
        }
      }
      const maxX = ROAD_WIDTH / 2 + SIDEWALK + 3;
      if (Math.abs(carPhys.pos.x) > maxX) {
        carPhys.speed *= 0.4;
        carPhys.pos.x = Math.sign(carPhys.pos.x) * maxX;
        camS.shake = Math.max(camS.shake, 0.3);
      }
      // Road end
      if (carPhys.pos.z < -ROAD_LENGTH - 10) {
        carPhys.speed *= 0.3;
        carPhys.pos.z = -ROAD_LENGTH - 10;
      }

      // Park check
      const parkPos = new THREE.Vector3(3.5, 0, CLUB_Z + 2);
      if (carPhys.pos.distanceTo(parkPos) < 4 && Math.abs(carPhys.speed) < 5) {
        showPrompt('<span class="key">E</span> — Park Et');
        if (inp.interact) {
          hidePrompt();
          gameState = 'park';
          fadeEl.classList.add('active');
          stopEngine();
          speedo.style.display = 'none';
          navInd.style.display = 'none';
          setTimeout(function() {
            carPhys.pos.set(3.5, 0.28, CLUB_Z + 2);
            carPhys.yaw = Math.PI;
            carPhys.speed = 0;
            carObj.position.copy(carPhys.pos);
            carObj.rotation.set(0, Math.PI, 0);

            charObj.position.set(4.5, 0, CLUB_Z + 4);
            charObj.rotation.y = Math.PI;
            charObj.visible = true;

            setTimeout(function() {
              fadeEl.classList.remove('active');
              gameState = 'walkToDoor';
              camS.mode = 'walk';
              camS.walkAngle = 3.0;
              charPos.copy(charObj.position);
              const behind = new THREE.Vector3(
                -Math.sin(camS.walkAngle) * camS.walkDist,
                camS.walkHeight,
                -Math.cos(camS.walkAngle) * camS.walkDist
              );
              cam.position.copy(charPos).add(behind);
              cam.lookAt(charPos);
            }, 500);
          }, 500);
        }
      } else if (carPhys.pos.distanceTo(parkPos) > 5) hidePrompt();
      break;
    }

    case 'walkToDoor': {
      let dx = 0, dz = 0;
      if (inp.forward) dz -= 1;
      if (inp.backward) dz += 1;
      if (inp.left) dx -= 1;
      if (inp.right) dx += 1;
      const moving = dx !== 0 || dz !== 0;

      if (moving) {
        const len = Math.sqrt(dx * dx + dz * dz);
        dx /= len;
        dz /= len;
        const targetAngle = Math.atan2(dx, dz);
        let diff = targetAngle - charObj.rotation.y;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        charObj.rotation.y += diff * Math.min(1, 10 * dt);

        const ca = camS.walkAngle;
        charObj.position.x += (dx * Math.cos(ca) - dz * Math.sin(ca)) * 3.5 * dt;
        charObj.position.z += (dx * Math.sin(ca) + dz * Math.cos(ca)) * 3.5 * dt;
        camS.walkAngle += mouseX * 0.003;
        mouseX = 0;
      }
      charPos.copy(charObj.position);
      animChar(charObj, dt, moving ? 1 : 0, moving);

      const doorPos = new THREE.Vector3(0, 0, CLUB_Z);
      if (charPos.distanceTo(doorPos) < 3) {
        showPrompt('<span class="key">E</span> — Gir');
        if (inp.interact) {
          hidePrompt();
          gameState = 'enterVenue';
          fadeEl.classList.add('active');
          doorSound();
          setTimeout(function() {
            charObj.position.set(0, 0, INTERIOR_Z + 1.5);
            charObj.rotation.y = 0;
            interiorObj.visible = true;
            charPos.copy(charObj.position);
            setTimeout(function() {
              fadeEl.classList.remove('active');
              gameState = 'interior';
              camS.mode = 'interior';
              cam.position.set(0, 1.7, INTERIOR_Z + 4.2);
              cam.lookAt(0, 1.0, INTERIOR_Z - 0.5);
            }, 500);
          }, 400);
        }
      } else hidePrompt();
      break;
    }

    case 'interior': {
      let dx = 0, dz = 0;
      if (inp.forward) dz -= 1;
      if (inp.backward) dz += 1;
      if (inp.left) dx -= 1;
      if (inp.right) dx += 1;
      const moving = dx !== 0 || dz !== 0;

      if (moving) {
        const len = Math.sqrt(dx * dx + dz * dz);
        dx /= len;
        dz /= len;
        const targetAngle = Math.atan2(dx, dz);
        let diff = targetAngle - charObj.rotation.y;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        charObj.rotation.y += diff * Math.min(1, 10 * dt);

        // Fixed direction in interior
        charObj.position.x += dx * 2.5 * dt;
        charObj.position.z += dz * 2.5 * dt;

        // Clamp inside room
        charObj.position.x = Math.max(-2.5, Math.min(2.5, charObj.position.x));
        charObj.position.z = Math.max(INTERIOR_Z + 2, Math.min(INTERIOR_Z + 6, charObj.position.z));
      }
      charPos.copy(charObj.position);
      animChar(charObj, dt, moving ? 1 : 0, moving);

      const tablePos = new THREE.Vector3(0, 0, INTERIOR_Z);
      if (charPos.distanceTo(tablePos) < 2.5) {
        showPrompt('<span class="key">E</span> — Teslim Et');
        if (inp.interact) {
          hidePrompt();
          gameState = 'delivery';
          deliveryPhase = 0;
        }
      } else hidePrompt();
      break;
    }

    case 'delivery': {
      deliveryPhase += dt;
      if (deliveryPhase < 1.0) {
        const p = deliveryPhase;
        if (briefcaseObj) {
          briefcaseObj.position.x = 0.42 - p * 0.3;
          briefcaseObj.position.z = 0.08 - p * 0.35;
          briefcaseObj.position.y = 0.55 - p * 0.15;
        }
        charObj.position.z += dt * 0.2;
      } else if (deliveryPhase < 2.0) {
        const p = deliveryPhase - 1.0;
        if (briefcaseObj) {
          briefcaseObj.position.x = 0.12 - p * 0.2;
          briefcaseObj.position.z = -0.27 - p * 0.4;
          briefcaseObj.position.y = 0.40 - p * 0.2;
        }
      } else if (deliveryPhase < 2.5) {
        if (briefcaseObj) briefcaseObj.visible = false;
      } else if (deliveryPhase < 3.5) {
        if (!dialogueActive) {
          showDialogue('DON VITO', 'Çantayı getirdin... Teşekkür ederim. Bu gece için sana minnettarım. Sen iyi bir adamsın.', function() {
            setTimeout(showComplete, 600);
          });
        }
      }
      break;
    }
  }

  // Camera
  updateCamera(dt, charPos, carObj, carPhys);

  // Render
  renderer.render(scene, cam);
}

// ==================== EVENT BINDINGS ====================
$('startBtn').addEventListener('click', function() {
  try {
  initAudio();
  buildWorld();
  menuEl.classList.add('hidden');
  startTime = performance.now();
  gameState = 'walk';
  camS.mode = 'walk';
  camS.walkAngle = 0.3;
  const behind = new THREE.Vector3(
    -Math.sin(camS.walkAngle) * camS.walkDist,
    camS.walkHeight,
    -Math.cos(camS.walkAngle) * camS.walkDist
  );
  cam.position.copy(charPos.clone().add(behind));
  cam.lookAt(charPos);
  } catch(e) { console.error('Start error:', e.message, e.stack); }
});

renderer.domElement.addEventListener('click', function() {
  if(camS.mode === 'walk' || camS.mode === 'walkToDoor')
    renderer.domElement.requestPointerLock();
});

$('replayBtn').addEventListener('click', function() {
  location.reload();
});

window.addEventListener('resize', function() {
  cam.aspect = window.innerWidth / window.innerHeight;
  cam.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ==================== START ====================
clock.start();
loop();
console.log('Mafya Şehri — Gizli Teslimat yüklendi. Three.js r128');

})();
</script>
</body>
</html>
